[project]
name = "open-learning"
version = "0.1.0"
description = "Private, source-grounded learning service"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.54.0", "sqlalchemy==2.0.52",
  "psycopg2-binary==2.9.12", "pgvector==0.5.0", "alembic==1.19.1",
  "pydantic-settings==2.16.0", "httpx==0.28.1", "trafilatura==2.0.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
