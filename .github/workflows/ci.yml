name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openlearning
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: openlearning_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U openlearning -d openlearning_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      OL_DATABASE_URL: postgresql+psycopg2://openlearning:test-only-password@localhost:5432/openlearning_test
      OL_TEST_DATABASE_URL: postgresql+psycopg2://openlearning:test-only-password@localhost:5432/openlearning_test
      OL_API_TOKEN: ci-only-token-abcdefghijklmnopqrstuvwxyz-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --python 3.12
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync alembic upgrade head
      - run: uv run --no-sync alembic check
      - run: uv run --no-sync pytest -q
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and test
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: open-learning-debug
          path: android/app/build/outputs/apk/debug/*.apk
